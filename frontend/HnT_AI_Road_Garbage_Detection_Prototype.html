<html lang="en">

<title>Road Garbage Control Room</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: dark brand rail on the left, light content canvas, floating cards. Brand: H&T green on cool neutrals; cyan marks live data and focus. Map is drawn from OpenStreetMap geometry. */
:root{--bg:#EEF2F0;--surface:#fff;--surface2:#F3F6F4;--line:#DCE4DF;--ink:#16211B;--ink2:#51625A;--brand:#2F7A37;--brand-ink:#fff;--brand-soft:#E3F1E4;--link:#00659B;--cyan:#00AEEF;--focus:#0070A8;--rail:#0F1F18;--rail-ink:#B9CBC1;--rail-on:#1E3A29;--shadow:0 1px 2px rgba(16,32,24,.06),0 6px 20px rgba(16,32,24,.07);
--new-bg:#E1EEFA;--new-fg:#15508F;--asg-bg:#FFF0D1;--asg-fg:#6E4300;--prog-bg:#EBE4F7;--prog-fg:#52308A;--clr-bg:#DCF1E4;--clr-fg:#17603F;--ver-bg:#1F6B45;--ver-fg:#fff;--dis-bg:#E6EAE8;--dis-fg:#44524B;--re-bg:#FBE2D8;--re-fg:#8A2A0D;
--m-land:#EEEBE3;--m-urban:#E7E3D9;--m-bld:#D9D4C8;--m-bld-s:#CAC4B6;--m-park:#CDE2BE;--m-water:#B3D2E6;--m-rail:#9B9B96;--m-label:#4B554F;--m-halo:#F6F4EE;
--m-min:#F9F7F2;--m-minc:#DAD5CA;--m-res:#fff;--m-resc:#D3CEC3;--m-sec:#fff;--m-secc:#BDB7AA;--m-pri:#FFE08A;--m-pric:#D6B24F;--m-trunk:#FBC96B;--m-trunkc:#CE9A36}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B120F;--surface:#141E19;--surface2:#1A2721;--line:#27372F;--ink:#E6EEE9;--ink2:#9FB1A7;--brand:#5DB765;--brand-ink:#0B1A0E;--brand-soft:#1B3223;--link:#5CC4F5;--focus:#5CC4F5;--rail:#08100C;--rail-on:#17301F;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--new-bg:#1A2F47;--new-fg:#A9D0F5;--asg-bg:#3D2F10;--asg-fg:#F5D493;--prog-bg:#2E2547;--prog-fg:#CDBDF2;--clr-bg:#173A28;--clr-fg:#9BE0B8;--ver-bg:#247A4E;--dis-bg:#2A3530;--dis-fg:#B8C6BE;--re-bg:#4A241A;--re-fg:#F5B9A3;
--m-land:#141D19;--m-urban:#18231E;--m-bld:#1F2C26;--m-bld-s:#2A3A33;--m-park:#183024;--m-water:#14304A;--m-rail:#4A5651;--m-label:#A9BBB0;--m-halo:#141D19;--m-min:#1C2823;--m-minc:#101814;--m-res:#27352E;--m-resc:#0F1713;--m-sec:#34443B;--m-secc:#0F1713;--m-pri:#5C4F25;--m-pric:#2B2410;--m-trunk:#7A6226;--m-trunkc:#32280E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B120F;--surface:#141E19;--surface2:#1A2721;--line:#27372F;--ink:#E6EEE9;--ink2:#9FB1A7;--brand:#5DB765;--brand-ink:#0B1A0E;--brand-soft:#1B3223;--link:#5CC4F5;--focus:#5CC4F5;--rail:#08100C;--rail-on:#17301F;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--new-bg:#1A2F47;--new-fg:#A9D0F5;--asg-bg:#3D2F10;--asg-fg:#F5D493;--prog-bg:#2E2547;--prog-fg:#CDBDF2;--clr-bg:#173A28;--clr-fg:#9BE0B8;--ver-bg:#247A4E;--dis-bg:#2A3530;--dis-fg:#B8C6BE;--re-bg:#4A241A;--re-fg:#F5B9A3;
--m-land:#141D19;--m-urban:#18231E;--m-bld:#1F2C26;--m-bld-s:#2A3A33;--m-park:#183024;--m-water:#14304A;--m-rail:#4A5651;--m-label:#A9BBB0;--m-halo:#141D19;--m-min:#1C2823;--m-minc:#101814;--m-res:#27352E;--m-resc:#0F1713;--m-sec:#34443B;--m-secc:#0F1713;--m-pri:#5C4F25;--m-pric:#2B2410;--m-trunk:#7A6226;--m-trunkc:#32280E;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif}
body.mr{font-family:'Noto Sans Devanagari','IBM Plex Sans',system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.shell{display:flex;min-height:100vh}
.rail{width:236px;flex:none;background:var(--rail);color:var(--rail-ink);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding-left:max(12px,env(safe-area-inset-left,0px))}
.logo{background:#fff;border-radius:10px;padding:6px 10px;display:block;line-height:0;margin-bottom:14px}.logo img{width:100%;max-width:170px;height:auto;display:block}
.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:0;background:none;color:var(--rail-ink);font-weight:500;cursor:pointer;text-align:left;width:100%}
.nv svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{background:rgba(255,255,255,.06)}
.nv[aria-current="page"]{background:var(--rail-on);color:#fff;font-weight:600}
.nv .n{margin-left:auto;font-size:11px;font-weight:700;background:#00AEEF;color:#04202c;padding:1px 8px;border-radius:99px}
.railf{margin-top:auto;font-size:12px;color:#7E9487;line-height:1.5;padding:8px 12px}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px max(20px,env(safe-area-inset-right,0px)) 12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:20px;line-height:1.2}.top small{display:block;font-size:12px;color:var(--ink2);font-weight:400}
.sp{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--brand-soft)}
.dot{width:8px;height:8px;border-radius:99px;background:var(--cyan)}.live.on .dot{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live.on .dot{animation:none}*{transition:none!important}}
.btn{height:38px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:600;padding:0 16px;cursor:pointer}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}.btn.sec:hover{background:var(--surface2)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}.btn.dng{background:var(--surface);color:var(--re-fg);border-color:var(--re-fg)}
.btn[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand)}
main{padding:20px max(20px,env(safe-area-inset-right,0px)) 48px 24px;max-width:1500px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}.tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.tile .l{font-size:12px;color:var(--ink2);font-weight:600;letter-spacing:.02em}.tile .v{font-size:32px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile svg.sp2{margin-top:4px;width:100%;height:26px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;opacity:.8}
.s-new{background:var(--new-bg);color:var(--new-fg)}.s-asg{background:var(--asg-bg);color:var(--asg-fg)}.s-prog{background:var(--prog-bg);color:var(--prog-fg)}.s-clr{background:var(--clr-bg);color:var(--clr-fg)}.s-ver{background:var(--ver-bg);color:var(--ver-fg)}.s-dis{background:var(--dis-bg);color:var(--dis-fg)}.s-re{background:var(--re-bg);color:var(--re-fg)}
.p-heap{background:var(--re-bg);color:var(--re-fg)}.p-lit{background:var(--dis-bg);color:var(--dis-fg)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.filters label,.fl{font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:3px;font-weight:600}
.f{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;min-width:0}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--ink2)}.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.split{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}.split>.main{flex:999 1 640px;min-width:0}.split>.side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:880px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:left;color:var(--ink2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover{background:var(--surface2)}tr.row.sel{background:var(--brand-soft)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:13px;font-variant-numeric:tabular-nums}
.thumb{width:96px;height:60px;border-radius:8px;display:block;object-fit:cover;background:#555}
.sla{font-size:13px;font-weight:600}.sla.risk{color:var(--re-fg)}.slab{height:4px;border-radius:99px;background:var(--surface2);margin-top:4px;width:84px;overflow:hidden}.slab i{display:block;height:100%;background:var(--brand)}.slab.risk i{background:#D9642B}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:700;display:block;margin-bottom:4px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 6px}.muted{color:var(--ink2);font-size:13px}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#222}.cam canvas,.cam img{display:block;width:100%;height:auto}
.camtag{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font:600 11px 'IBM Plex Mono',monospace;padding:3px 8px;border-radius:6px}
.rec{color:#ff5d5d}
.tl{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.tl time{flex:none;width:48px;color:var(--ink2);font-family:'IBM Plex Mono',monospace}
#drawerBg{position:fixed;inset:0;background:rgba(5,12,8,.6);backdrop-filter:blur(2px);z-index:60;display:flex;justify-content:flex-end}
#drawer{width:min(1020px,100%);background:var(--bg);height:100%;overflow:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) 40px 18px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:calc(100% - 32px)}
.tst{background:#0F1F18;color:#fff;border:1px solid #4C9150;border-radius:12px;padding:10px 16px;font-size:14px;max-width:560px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.bar{height:10px;border-radius:99px;background:var(--brand)}.bar.amb{background:#D9822B}.track{background:var(--surface2);border-radius:99px;flex:1;overflow:hidden}
.mapwrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);height:clamp(440px,72vh,760px);background:var(--m-land);touch-action:none}
.mapwrap svg.map{width:100%;height:100%;display:block;cursor:grab}.mapwrap svg.map:active{cursor:grabbing}
.mfloat{position:absolute;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.mzoom{right:12px;top:12px;display:flex;flex-direction:column}.mzoom button{width:38px;height:38px;border:0;background:none;font-size:20px;font-weight:600;cursor:pointer}.mzoom button+button{border-top:1px solid var(--line)}
.mlay{left:12px;top:12px;display:flex;gap:4px;padding:5px;flex-wrap:wrap}
.mleg{left:12px;bottom:12px;padding:8px 12px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100% - 140px)}
.mattr{right:8px;bottom:6px;font-size:10px;padding:2px 6px;border-radius:6px;color:var(--ink2)}
.mlabel{font:600 8.5px 'IBM Plex Sans',sans-serif;fill:var(--m-label);paint-order:stroke;stroke:var(--m-halo);stroke-width:2.6px;stroke-linejoin:round;pointer-events:none}
.hs{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rk{flex:none;width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700;display:flex;align-items:center;justify-content:center}
.sw{width:42px;height:24px;border-radius:99px;border:0;background:#8FA096;position:relative;cursor:pointer;flex:none}.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:99px;background:#fff;transition:left .15s}.sw[aria-checked="true"]{background:var(--brand)}.sw[aria-checked="true"]::after{left:21px}
.rowf{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
pre{margin:0;font:12px/1.5 'IBM Plex Mono',monospace;white-space:pre-wrap;word-break:break-all;background:var(--surface2);padding:10px;border-radius:10px;max-height:220px;overflow:auto}
.phone{width:316px;max-width:100%;height:664px;border-radius:38px;border:10px solid #0F1F18;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;flex:none;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.ph-h{background:var(--brand);color:var(--brand-ink);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.ph-b{padding:12px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.big{min-height:52px;border-radius:14px;border:0;font-weight:700;font-size:16px;cursor:pointer;width:100%;background:var(--brand);color:var(--brand-ink)}.big.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink2)}.big small{display:block;font-weight:500;font-size:11px;opacity:.85}
.bub{background:var(--surface2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:14px;line-height:1.55;cursor:pointer;text-align:left;width:100%}
.task{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.err{color:var(--re-fg);font-weight:600;font-size:13px}
.mini{border-radius:12px;overflow:hidden;border:1px solid var(--line);height:130px;background:var(--m-land)}.mini svg{width:100%;height:100%;display:block}
@media(max-width:960px){.shell{flex-direction:column}.rail{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;align-items:center;padding:8px 12px}.logo{margin:0 8px 0 0;flex:none}.logo img{width:110px}.nv{width:auto;flex:none;padding:9px 12px}.railf{display:none}.top{position:static}}
@media(max-width:600px){.nv span.t{display:none}.nv .n{margin-left:2px}}
</style>
</head>

 case 'csv':var rows=[['id','type','vehicle','road','side','chainage','ward','time','status']].concat(filtered().map(function(a){return [a.id,a.type,a.veh,a.road,a.side,chf(a.ch),a.ward,hhmm(a.t0),a.status]})).map(function(r){return r.join(',')}).join('\n');copy(rows,'CSV copied ('+filtered().length+' rows). Paste into Excel.');break;
 case 'qassign':var a=byId(id);assign(id,'Ward '+a.ward+' sanitary officer',Math.max(a.t0+(a.type==='Heap'?S.settings.heapH:S.settings.litH)*60,S.now+30),'');refreshAll();break;
 case 'doassign':assign(id,document.getElementById('dAs').value,+document.getElementById('dDue').value,document.getElementById('dNote').value);refreshAll();break;
 case 'dodismiss':dismiss(id,d.r);S.drawerId=null;document.getElementById('drawerHost').innerHTML='';refreshAll();break;
 case 'doreopen':reopen(id);refreshAll();break;
 case 'remind':var q=byId(id);S.sms.unshift({id:id,ward:q.ward,t:S.now});log(q,'SMS reminder sent');audit('Operator reminded '+q.assignee+' about A-'+id);toast('Reminder sent.');refreshAll();break;
 case 'gophone':var r2=byId(id);S.phone.ward=r2.ward;S.phone.view='detail';S.phone.id=id;S.drawerId=null;document.getElementById('drawerHost').innerHTML='';goTab('phone');break;
 case 'pass':nextPass(id,d.still==='1');refreshAll();break;
 case 'close':closeDrawer();break;
 case 'prev':case 'next':var L=filtered(),i=L.indexOf(byId(S.drawerId)),j=act==='next'?Math.min(L.length-1,i+1):Math.max(0,i-1);if(L[j]){S.drawerId=L[j].id;S.sel=L[j].id;S.drawerFocused=1;vDrawer()}break;
 case 'layer':S.layers[d.l]=!S.layers[d.l];b.setAttribute('aria-pressed',S.layers[d.l]);dynMap();break;
 case 'zin':zoomAt(.7,.5,.5);break;case 'zout':zoomAt(1.4,.5,.5);break;
 case 'zfit':var rr=document.getElementById('mapwrap').getBoundingClientRect();fitView(rr.width,rr.height);dynMap();break;
 case 'msel':S.sel=id;dynMap();break;
 case 'mpick':S.sel=id;var pp=ptAt(byId(id).road,byId(id).ch);S.view.x=pp.x-S.view.w/2;S.view.y=pp.y-S.view.h/2;dynMap();break;
 case 'stand':S.standing.push({kind:document.getElementById('sKind').value,owner:document.getElementById('sOwn').value,review:document.getElementById('sRev').value,where:d.road+' '+chf(+d.b*50)});audit('Standing task created at '+d.road+' '+chf(+d.b*50));toast('Standing task created.');vHot();break;
 case 'unstand':S.standing.splice(+d.i,1);vHot();break;
 case 'sched':S.sched=!S.sched;audit('Weekly PDF '+(S.sched?'scheduled':'unscheduled'));vReports();break;
 case 'copysum':var s=stats();copy('Road garbage summary '+hhmm(S.now)+': '+s.n+' alerts, accuracy '+(s.acc==null?'n/a':s.acc+'%')+', median time to clear '+(s.med==null?'n/a':(s.med/60).toFixed(1)+' h')+', repeat spots '+s.rep+'.','Summary copied.');break;
 case 'tog':S.settings[d.k]=!S.settings[d.k];audit('Setting '+d.k+' set to '+S.settings[d.k]);b.setAttribute('aria-checked',S.settings[d.k]);break;
 case 'vtog':var v=S.fleet[+d.i];v.online=!v.online;audit(v.n+' set '+(v.online?'online':'offline'));dynAdmin();break;
 case 'popen':S.phone.id=id;S.phone.view='detail';S.phone.err='';S.phone.photo='';dynPhone();break;
 case 'plist':S.phone.view='list';dynPhone();break;
 case 'pback':S.phone.view=(S.phone.view==='detail'||S.phone.view==='close')?'list':'inbox';dynPhone();break;
 case 'pnav':toast('Opens the phone maps app at this chainage (demo).');break;
 case 'pstart':start(id);dynPhone();renderRail();break;
 case 'pclose':S.phone.view='close';S.phone.err='';dynPhone();break;
 case 'pdone':if(clearA(id,S.phone.photo)){S.phone.view='done';S.phone.photo=''}else{S.phone.err='फोटो आवश्यक आहे. Photo is required by the city rule.'}dynPhone();renderRail();break;
 case 'pcant':cant(id,d.r);S.phone.view='list';toast('Operator notified: '+d.r);dynPhone();renderRail();break}});
document.addEventListener('input',function(e){var el=e.target;if(el.dataset.f!=null){S.f[el.dataset.f]=el.value;dynAlerts()}});
document.addEventListener('change',function(e){var el=e.target;if(el.dataset.f!=null){S.f[el.dataset.f]=el.value;dynAlerts()}
 if(el.dataset.pw){S.phone.ward=el.value;S.phone.view='inbox';dynPhone()}
 if(el.dataset.set){var k=el.dataset.set,v=k==='conf'?parseFloat(el.value):Math.max(1,+el.value||1);S.settings[k]=v;audit('Setting '+k+' changed to '+v);toast('Saved: '+k+' = '+v)}
 if(el.id==='pPhoto'&&el.files&&el.files[0]){S.phone.photo=el.files[0].name;S.phone.err='';var pf=document.getElementById('pFile');if(pf)pf.textContent=S.phone.photo}
 if(el.id==='dDue'){var a=byId(S.drawerId),pv=document.getElementById('smsPrev');if(pv&&a)pv.textContent=smsText(Object.assign({},a,{due:+el.value}),'mr')}});
document.addEventListener('keydown',function(e){var tg=e.target,typing=/INPUT|SELECT|TEXTAREA/.test(tg.tagName);
 if(e.key==='Escape'&&S.drawerId){closeDrawer();return}
 if(typing){if(e.key==='Escape')tg.blur();return}
 if(e.key==='Enter'&&tg.dataset&&tg.dataset.act==='msel'){S.sel=+tg.dataset.id;dynMap();return}
 if(S.tab!=='alerts')return;var L=filtered(),i=L.indexOf(byId(S.sel));
 if(e.key==='/'){e.preventDefault();var q=document.getElementById('fQ');if(q)q.focus();return}
 if(S.drawerId){var a=byId(S.drawerId);if(e.key==='a'&&(a.status==='New'||a.status==='Reopened')){var b=document.querySelector('[data-act=doassign]');if(b)b.click()}if(e.key==='x'){var d=document.querySelector('[data-act=dodismiss]');if(d)d.click()}return}
 if(e.key==='j'){if(L[i+1]){S.sel=L[i+1].id;dynAlerts()}}else if(e.key==='k'){if(L[i-1]){S.sel=L[i-1].id;dynAlerts()}}
 else if(e.key===' '||e.key==='Enter'){if(tg.tagName==='BUTTON')return;e.preventDefault();if(S.sel)openDrawer(S.sel)}
 else if(e.key==='a'||e.key==='x'){var s=byId(S.sel);if(s&&(s.status==='New'||s.status==='Reopened'))openDrawer(s.id)}});
window.addEventListener('resize',function(){if(S.tab==='map')dynMap()});
buildBase();renderRail();renderHeader();renderTab();
setInterval(stepTick,1000);
})();
</script>
